<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation Demonstration</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    font-family:Arial, sans-serif;
  }

  .container{
    display:flex;
    gap:40px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
  }

  .box{
    width:80px;
    height:80px;
    background:#2563eb;
    border-radius:10px;
    animation:moveBox 3s ease-in-out infinite;
  }

  @keyframes moveBox{
    0%{transform:translateX(0);} 
    50%{transform:translateX(60px);} 
    100%{transform:translateX(0);} 
  }

  .ball{
    width:70px;
    height:70px;
    background:#0d9488;
    border-radius:50%;
    animation:bounce 1.2s ease-in-out infinite alternate;
  }

  @keyframes bounce{
    0%{transform:translateY(0);} 
    100%{transform:translateY(-80px);} 
  }

  .text{
    font-size:1.6rem;
    font-weight:bold;
    animation:colorChange 2s ease-in-out infinite alternate;
    animation-delay:0.4s;
  }

  @keyframes colorChange{
    0%{color:#be123c;} 
    100%{color:#1e3a8a;} 
  }
</style>
</head>
<body>

<div class="container">
  <div class="box"></div>
  <div class="ball"></div>
  <div class="text">Animated Text</div>
</div>

</body>
</html>

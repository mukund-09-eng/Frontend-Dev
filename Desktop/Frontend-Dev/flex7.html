<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Loading Animation</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
  }

  .loader{
    display:flex;
    gap:15px;
  }

  .dot{
    width:18px;
    height:18px;
    background:#1e3a8a;
    border-radius:50%;
    animation:bounce 0.6s infinite ease-in-out;
  }

  .dot:nth-child(2){animation-delay:0.15s;}
  .dot:nth-child(3){animation-delay:0.3s;}

  @keyframes bounce{
    0%{transform:translateY(0);} 
    50%{transform:translateY(-15px);} 
    100%{transform:translateY(0);} 
  }
</style>
</head>
<body>

<div class="loader">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

</body>
</html>

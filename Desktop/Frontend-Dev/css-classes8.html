<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Box-Sizing Comparison</title>
<style>
  body{
    margin:0;
    padding:40px;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:30px;
  }

  h1{
    text-align:center;
  }

  .container{
    display:flex;
    gap:40px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
  }

  .box{
    width:200px;
    padding:30px;
    border:5px solid #1e3a8a;
    color:white;
    text-align:center;
    border-radius:10px;
  }

  .content-box{
    background:#2563eb;
    box-sizing:content-box;
  }

  .border-box{
    background:#0d9488;
    box-sizing:border-box;
  }

  p.info{
    max-width:750px;
    text-align:center;
    font-size:1rem;
    color:#333;
  }
</style>
</head>
<body>

<h1>Box-Sizing Comparison</h1>
<p class="info">Both boxes below have the same declared width and padding. "content-box" adds padding and border to the total size, making the box larger. "border-box" keeps the total size fixed, including padding and borders.</p>

<div class="container">
  <div class="box content-box">content-box</div>
  <div class="box border-box">border-box</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Agency Showcase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">

    <h2 class="text-center mb-4">Explore Our Top Destinations</h2>

    <div id="travelCarousel" class="carousel slide mb-4" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active" data-bs-interval="3000">
                <img src="https://picsum.photos/1200/400?random=1" class="d-block w-100" alt="Destination 1">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Paris, France</h5>
                    <p>The City of Love awaits you.</p>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="3500">
                <img src="https://picsum.photos/1200/400?random=2" class="d-block w-100" alt="Destination 2">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Bali, Indonesia</h5>
                    <p>Relax on peaceful beaches.</p>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="4000">
                <img src="https://picsum.photos/1200/400?random=3" class="d-block w-100" alt="Destination 3">
                <div class="carousel-caption d-none d-md-block">
                    <h5>New York, USA</h5>
                    <p>The city that never sleeps.</p>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <h5 class="mb-2">Booking Progress</h5>
    <div class="progress mb-4">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 70%;">
            70%
        </div>
    </div>

</div>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">Contact Us: info@travelagency.com | +91 98765 43210</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Movie Ticket Booking</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input { padding: 8px; width: 250px; display: block; margin-bottom: 10px; }
    .error { color: red; font-size: 14px; }
    .valid { border: 2px solid green; }
    .invalid { border: 2px solid red; }
    #ticket { margin-top: 20px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>

<h2>Movie Ticket Booking</h2>

<label>Name</label>
<input type="text" id="name">
<div id="nameError" class="error"></div>

<label>Email</label>
<input type="text" id="email">
<div id="emailError" class="error"></div>

<label>Seats</label>
<input type="number" id="seats">
<div id="seatError" class="error"></div>

<button id="bookBtn">Book Ticket</button>

<div id="ticket"></div>

<script>
  const nameInput = document.getElementById("name");
  const emailInput = document.getElementById("email");
  const seatsInput = document.getElementById("seats");

  function validate(input, pattern, errorBox, msg) {
    if (pattern.test(input.value)) {
      input.classList.add("valid");
      input.classList.remove("invalid");
      errorBox.innerText = "";
      return true;
    } else {
      input.classList.add("invalid");
      input.classList.remove("valid");
      errorBox.innerText = msg;
      return false;
    }
  }

  document.getElementById("bookBtn").addEventListener("click", () => {
    const nameValid = validate(nameInput, /^[A-Za-z ]+$/, nameError, "Only alphabets allowed");
    const emailValid = validate(emailInput, /^[^\s@]+@[^\s@]+\.[^\s@]+$/, emailError, "Invalid email");
    const seatValid = validate(seatsInput, /^[1-9]$|^10$/, seatError, "Seats must be 1-10");

    if (nameValid && emailValid && seatValid) {
      const booking = {
        name: nameInput.value,
        email: emailInput.value,
        seats: seatsInput.value
      };
      document.getElementById("ticket").innerText =
        "Ticket Booked: " + booking.name + ", " + booking.email + ", Seats: " + booking.seats;
    }
  });
</script>

</body>
</html>

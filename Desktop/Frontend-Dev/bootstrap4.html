<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container py-5">

    <h2 class="text-center mb-4">Today's Menu</h2>
    <p class="text-center lead">Enjoy our freshly prepared dishes</p>

    <div class="text-center mb-4">
        <img src="https://placehold.co/600x300" class="img-fluid rounded" alt="Food Image">
        <p class="mt-2">Delicious Signature Dish</p>
    </div>

    <h4 class="mb-3">Menu Items</h4>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Category</th>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Starters</td>
                <td>Tomato Soup</td>
                <td>₹120</td>
            </tr>
            <tr>
                <td>Main Course</td>
                <td>Paneer Butter Masala</td>
                <td>₹250</td>
            </tr>
            <tr>
                <td>Drinks</td>
                <td>Mango Shake</td>
                <td>₹90</td>
            </tr>
        </tbody>
    </table>

    <h4 class="mt-5 mb-3">Chef's Specials</h4>
    <ul class="list-group">
        <li class="list-group-item">Special Tandoori Platter</li>
        <li class="list-group-item">Butter Garlic Naan</li>
        <li class="list-group-item">Sizzling Brownie</li>
    </ul>

</div>

</body>
</html>

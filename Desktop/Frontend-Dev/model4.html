<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shadows & Depth Effects</title>
<style>
  body{
    margin:0;
    padding:40px;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
  }

  h1{
    text-align:center;
    margin-bottom:30px;
    font-size:2rem;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
  }

  .container{
    display:flex;
    gap:25px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .card{
    width:260px;
    background:white;
    padding:20px;
    border-radius:12px;
    transition:0.3s ease;
  }

  .shadow1{box-shadow:0 3px 8px rgba(0,0,0,0.2);} 
  .shadow2{box-shadow:0 5px 15px rgba(0,0,0,0.25);} 
  .shadow3{box-shadow:0 8px 25px rgba(0,0,0,0.35);} 

  .card:hover{
    transform:translateY(-10px);
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<h1>Shadows & Depth Effect Demo</h1>

<div class="container">
  <div class="card shadow1">
    <h3>Card One</h3>
    <p>Light shadow for a clean, minimal depth effect.</p>
  </div>

  <div class="card shadow2">
    <h3>Card Two</h3>
    <p>Medium shadow for stronger separation from the background.</p>
  </div>

  <div class="card shadow3">
    <h3>Card Three</h3>
    <p>Heavy shadow for a bold, lifted appearance.</p>
  </div>
</div>

</body>
</html>

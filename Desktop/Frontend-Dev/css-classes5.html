<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Styled Button Collection</title>
<style>
  body{
    margin:0;
    padding:40px;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .btn-container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
  }

  button{
    padding:12px 24px;
    font-size:1rem;
    border-radius:8px;
    cursor:pointer;
    border:none;
    transition:0.3s;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
  }

  .primary{
    background:#2563eb;
    color:white;
  }
  .primary:hover{background:#1e3a8a;}
  .primary:active{background:#142554;}

  .secondary{
    background:#0d9488;
    color:white;
  }
  .secondary:hover{background:#0f766e;}
  .secondary:active{background:#064e3b;}

  .outline{
    background:transparent;
    border:2px solid #2563eb;
    color:#2563eb;
  }
  .outline:hover{
    background:#2563eb;
    color:white;
  }
  .outline:active{
    background:#1e3a8a;
    color:white;
    border-color:#1e3a8a;
  }

  .disabled{
    background:#d1d5db;
    color:#6b7280;
    cursor:not-allowed;
    box-shadow:none;
  }
  .disabled:disabled{}

  button:focus{
    outline:3px solid #9333ea;
  }
</style>
</head>
<body>

<div class="btn-container">
  <button class="primary">Primary</button>
  <button class="secondary">Secondary</button>
  <button class="outline">Outline</button>
  <button class="disabled" disabled>Disabled</button>
</div>

</body>
</html>

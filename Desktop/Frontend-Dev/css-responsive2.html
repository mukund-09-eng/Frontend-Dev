<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Flexbox Layout</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    /* Header */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: #333;
        color: white;
    }

    header .logo {
        font-size: 22px;
        font-weight: bold;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-size: 16px;
    }

    nav a:hover {
        text-decoration: underline;
    }

    /* Main Feature Boxes */
    .main {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 40px 20px;
    }

    .box {
        flex: 1;
        background: white;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        transition: transform 0.3s ease;
    }

    /* Hover scale effect */
    .box:hover {
        transform: scale(1.05);
    }

    /* Footer */
    footer {
        text-align: center;
        padding: 15px 0;
        background: #333;
        color: white;
        margin-top: 20px;
    }

    /* Responsive: below 750px → stack vertically */
    @media (max-width: 750px) {
        .main {
            flex-direction: column;
        }
    }
</style>
</head>

<body>

<!-- Header -->
<header>
    <div class="logo">MyWebsite</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<!-- Main Section -->
<div class="main">
    <div class="box">Feature Box 1</div>
    <div class="box">Feature Box 2</div>
    <div class="box">Feature Box 3</div>
</div>

<!-- Footer -->
<footer>
    © 2025 MyWebsite. All Rights Reserved.
</footer>

</body>
</html>

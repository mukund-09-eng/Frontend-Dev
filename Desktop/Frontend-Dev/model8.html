<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Box Model Exploration</title>
<style>
  body{
    margin:0;
    padding:40px;
    background:#f5f5f5;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:40px;
  }

  .section-title{
    font-size:1.8rem;
    font-weight:bold;
    margin-bottom:10px;
  }

  .demo-container{
    display:flex;
    gap:60px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .box-wrap{
    text-align:center;
  }

  .box-default, .box-borderbox{
    width:200px;
    background:#dbeafe;
    padding:20px;
    border:5px solid #2563eb;
    margin:20px;
    outline:3px dashed #1e40af;
  }

  .box-default{
    box-sizing:content-box;
  }

  .box-borderbox{
    box-sizing:border-box;
  }

  .label{
    margin-top:10px;
    font-weight:bold;
  }
</style>
</head>
<body>

<div class="section-title">Box Model Exploration</div>
<p style="max-width:700px; text-align:center;">This page demonstrates how content, padding, border, and margin affect the total size of an element. It also compares the default <strong>content-box</strong> model with <strong>border-box</strong>.</p>

<div class="demo-container">

  <div class="box-wrap">
    <div class="box-default">Content Box Model</div>
    <div class="label">Default: content-box</div>
  </div>

  <div class="box-wrap">
    <div class="box-borderbox">Border Box Model</div>
    <div class="label">box-sizing: border-box</div>
  </div>

</div>

</body>
</html>

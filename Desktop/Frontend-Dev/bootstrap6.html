<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

    <h2 class="text-center mb-4">Notifications Dashboard</h2>

    <div class="card p-4">

        <div class="alert alert-success mb-3">
            ✔ New Message Received Successfully!
        </div>

        <div class="alert alert-info mb-3">
            ℹ Daily Tip: Stay consistent with your learning.
        </div>

        <div class="alert alert-danger mb-3">
            ⚠ Warning: Your account needs verification.
        </div>

        <div class="alert alert-warning alert-dismissible fade show mb-3" role="alert">
            This is a dismissible notification.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="bg-light border rounded p-3 mt-4">
            <h5 class="mb-2">Summary</h5>
            <p class="mb-0">You have 3 new notifications. Review them to stay updated.</p>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

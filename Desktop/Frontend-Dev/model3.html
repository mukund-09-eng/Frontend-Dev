<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gradient Background Webpage</title>
<style>
  body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
  }

  header, footer{
    position:fixed;
    left:0;
    width:100%;
    background:#1e3a8a;
    color:white;
    text-align:center;
    padding:15px;
    z-index:10;
  }

  header{top:0;}
  footer{bottom:0;}

  section{
    padding:120px 20px 120px;
    text-align:center;
    color:white;
    font-size:1.6rem;
  }

  .linear{
    background:linear-gradient(135deg, #3b82f6, #9333ea);
  }

  .radial{
    background:radial-gradient(circle, #f59e0b, #b91c1c);
    background-attachment:fixed;
  }
</style>
</head>
<body>

<header>Gradient Background Demo</header>

<section class="linear">
  <h2>Linear Gradient Background</h2>
  <p>This section uses a linear gradient.</p>
</section>

<section class="radial">
  <h2>Radial Gradient Background</h2>
  <p>This section uses a radial gradient with a parallax-like fixed background.</p>
</section>

<footer>© 2025 Gradient Demo Page</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outline & Focus Styling Form</title>
<style>
  body{
    margin:0;
    padding:40px;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }

  .form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    width:330px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
  }

  h2{
    text-align:center;
    margin-bottom:20px;
  }

  input, textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:1rem;
    outline:3px solid transparent;
    outline-offset:4px;
    transition:0.3s;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }

  input:focus, textarea:focus{
    outline:3px solid #2563eb;
    outline-offset:2px;
  }

  button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
  }

  button:hover{
    background:#1e3a8a;
  }
</style>
</head>
<body>

<div class="form-box">
  <h2>Contact Us</h2>
  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea rows="4" placeholder="Your Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</div>

</body>
</html>

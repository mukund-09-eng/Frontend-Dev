<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pricing Plans</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .pricing-card {
            transition: 0.3s;
        }
        .pricing-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--bs-shadow-lg);
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h2 class="text-center mb-5">Choose Your Plan</h2>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card pricing-card p-3">
                <h4 class="text-center">Basic</h4>
                <h2 class="text-center">$9/mo</h2>
                <ul class="list-group list-group-flush mb-3">

                    <li class="list-group-item">Basic Analytics</li>
                </ul>
                <button class="btn btn-outline-primary w-100">Select</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card pricing-card p-3 bg-primary text-white">
                <h4 class="text-center">Pro</h4>
                <h2 class="text-center">$19/mo</h2>
                <ul class="list-group list-group-flush mb-3">
                    <li class="list-group-item bg-primary text-white">20 Projects</li>
                    <li class="list-group-item bg-primary text-white">Priority Support</li>
                    <li class="list-group-item bg-primary text-white">Advanced Analytics</li>
                </ul>
                <button class="btn btn-light w-100">Select</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card pricing-card p-3">
                <h4 class="text-center">Enterprise</h4>
                <h2 class="text-center">$49/mo</h2>
                <ul class="list-group list-group-flush mb-3">
                    <li class="list-group-item">Unlimited Projects</li>
                    <li class="list-group-item">24/7 Support</li>
                    <li class="list-group-item">Custom Solutions</li>
                </ul>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

    <div class="container text-center p-5">

        <h1 class="fw-bold mt-4">Your Name</h1>
        <p class="mb-3">Web Developer | Designer | Freelancer</p>

        <img src="https://via.placeholder.com/150"
             class="img-fluid rounded-circle mb-3"
             alt="Profile Image">

        <div class="mb-3">
            <button class="btn btn-primary">Hire Me</button>
            <button class="btn btn-secondary">Download CV</button>
        </div>

        <form>
            <input type="text" class="form-control mb-2" placeholder="Your Name">
            <input type="email" class="form-control mb-2" placeholder="Your Email">
            <textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
            <button class="btn btn-dark w-100">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>

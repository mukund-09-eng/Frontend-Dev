<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Grid Dashboard</title>
<style>
  body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f4f8;
  }

  .grid-container{
    display:grid;
    grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-gap:20px;
    padding:20px;
    min-height:100vh;
  }

  header{
    grid-column:1 / span 2;
    background:#1e3a8a;
    color:white;
    padding:20px;
    font-size:1.5rem;
    font-weight:bold;
    border-radius:8px;
  }

  .sidebar{
    background:#1f2937;
    color:white;
    padding:20px;
    border-radius:8px;
  }

  .sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:10px 0;
    margin-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }

  .content{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    grid-gap:20px;
  }

  .box{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
    transition:0.3s;
  }

  .box:hover{
    transform:scale(1.05);
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }

  .wide{
    grid-column:span 2;
  }

</style>
</head>
<body>

<div class="grid-container">

  <header>Dashboard Overview</header>

  <div class="sidebar">
    <a href="#">Home</a>
    <a href="#">Analytics</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
  </div>

  <div class="content">
    <div class="box wide">Wide Box (Spans 2 Columns)</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>

</div>

</body>
</html>

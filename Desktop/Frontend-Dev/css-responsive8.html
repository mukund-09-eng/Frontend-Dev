<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Comparison Layout</title>

<style>
    body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
    }

    .comparison {
        display: flex;
        gap: 20px;
        justify-content: center;
    }

    .box {
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        text-align: center;
        transition: transform 0.3s ease;
        width: 100%;
        max-width: 400px;
    }

    .box img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
        transition: filter 0.5s ease;
    }

    .filtered img {
        filter: brightness(50%);
    }

    .filtered img:hover {
        filter: none;
    }

    .caption {
        margin-top: 10px;
        font-weight: bold;
        color: #444;
    }

    @media (max-width: 700px) {
        .comparison {
            flex-direction: column;
            align-items: center;
        }
        .box {
            width: 90%;
        }
    }
</style>
</head>

<body>

<h2 style="text-align:center; margin-bottom:25px;">Filter Comparison Demo</h2>

<div class="comparison">

    <div class="box">
        <img src="https://picsum.photos/500/300?random=1">
        <div class="caption">Original Image</div>
    </div>

    <div class="box filtered">
        <img src="https://picsum.photos/500/300?random=1">
        <div class="caption">Filtered (Brightness Reduced)</div>
    </div>

</div>

</body>
</html>

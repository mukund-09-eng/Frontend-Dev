<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Principles Summary</title>

<style>
    body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: background 0.4s ease, color 0.3s ease, transform 0.3s ease;
    }

    .box:hover {
        background: linear-gradient(135deg, #6ea8ff, #9fc7ff);
        color: white;
        transform: translateY(-6px);
    }

    .title {
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .code {
        margin-top: 10px;
        font-family: monospace;
        background: #eee;
        padding: 8px;
        border-radius: 6px;
    }

    @media (max-width: 600px) {
        .grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<h1>Responsive Design Principles</h1>

<div class="grid">

    <div class="box">
        <div class="title">Fluid Layouts</div>
        <div>Use percentage widths to allow elements to grow/shrink.</div>
        <div class="code">width: 80%;</div>
    </div>

    <div class="box">
        <div class="title">Flexible Media</div>
        <div>Images and videos resize automatically within containers.</div>
        <div class="code">img { max-width: 100%; }</div>
    </div>

    <div class="box">
        <div class="title">Breakpoints</div>
        <div>Change layout at specific screen widths.</div>
        <div class="code">@media (max-width: 600px)</div>
    </div>

</div>

</body>
</html>

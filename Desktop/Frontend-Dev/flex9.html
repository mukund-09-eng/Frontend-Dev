<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Card Flip Animation</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
  }

  .card-container{
    perspective:1000px;
  }

  .card{
    width:300px;
    height:380px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.7s ease;
  }

  .card-container:hover .card{
    transform:rotateY(180deg);
  }

  .side{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
  }

  .front{
    background:white;
    display:flex;
    flex-direction:column;
    text-align:center;
  }

  .front img{
    width:100%;
    height:250px;
    object-fit:cover;
  }

  .front h2{
    margin:15px 0;
  }

  .back{
    background:#1e3a8a;
    color:white;
    transform:rotateY(180deg);
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
  }
</style>
</head>
<body>

<div class="card-container">
  <div class="card">
    <div class="side front">
      <img src="https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=800&q=60" />
      <h2>Beautiful Place</h2>
    </div>

    <div class="side back">
      <p>A stunning travel destination known for its natural landscapes and peaceful atmosphere.</p>
    </div>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini UI Layout</title>
<style>
  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f3f4f6;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header{
    background:#1e3a8a;
    color:white;
    padding:15px;
    text-align:center;
    font-size:1.4rem;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
  }

  .main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
  }

  .card{
    background:white;
    padding:25px;
    width:360px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    display:flex;
    flex-direction:column;
    gap:18px;
    text-align:center;
  }

  .card img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:10px;
  }

  input, textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:1rem;
    transition:0.3s;
  }

  input:focus, textarea:focus{
    border-color:#2563eb;
    outline:none;
    box-shadow:0 0 6px rgba(37,99,235,0.4);
  }

  button{
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
  }

  button:hover{
    background:#1e3a8a;
  }

  button:active{
    transform:scale(0.96);
  }

  footer{
    background:#1f2937;
    color:white;
    padding:12px;
    text-align:center;
    font-size:0.9rem;
  }
</style>
</head>
<body>

<header>Mini UI Layout</header>

<div class="main">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=60" />

    <form>
      <input type="text" placeholder="Your Name" required>
      <textarea rows="3" placeholder="Message" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<footer>© 2025 Mini UI Layout</footer>

</body>
</html>
